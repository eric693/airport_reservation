<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台登入 - 機場接送管理系統</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: #0F1C2E;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* 背景裝飾圓 */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(74,155,143,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,43,74,0.6) 0%, transparent 70%);
    pointer-events: none;
  }

  .login-card {
    background: #1A2B4A;
    border-radius: 20px;
    padding: 52px 48px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
    border: 1px solid rgba(74,155,143,0.15);
  }

  .brand {
    text-align: center;
    margin-bottom: 40px;
  }

  .brand-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #4A9B8F, #2C7A73);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(74,155,143,0.35);
  }

  .brand-icon svg {
    width: 28px;
    height: 28px;
    fill: white;
  }

  .brand-title {
    font-size: 22px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 0.5px;
  }

  .brand-sub {
    font-size: 13px;
    color: #8BA3C7;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #8BA3C7;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    fill: #4A6080;
    pointer-events: none;
    transition: fill 0.2s;
  }

  input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: #0F1C2E;
    border: 1px solid rgba(74,155,143,0.2);
    border-radius: 10px;
    color: #FFFFFF;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder { color: #4A6080; }

  input:focus {
    border-color: #4A9B8F;
    box-shadow: 0 0 0 3px rgba(74,155,143,0.15);
  }

  input:focus + svg,
  .input-wrap:focus-within svg {
    fill: #4A9B8F;
  }

  /* Fix icon layering */
  .input-wrap svg { z-index: 1; }
  .input-wrap input { position: relative; }

  .error-msg {
    background: rgba(204,51,51,0.12);
    border: 1px solid rgba(204,51,51,0.3);
    border-radius: 8px;
    padding: 11px 14px;
    color: #FF7070;
    font-size: 13px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4A9B8F, #2C7A73);
    border: none;
    border-radius: 10px;
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(74,155,143,0.35);
    letter-spacing: 0.5px;
    margin-top: 8px;
  }

  .btn-login:hover {
    opacity: 0.92;
    box-shadow: 0 8px 28px rgba(74,155,143,0.45);
  }

  .btn-login:active { transform: scale(0.98); }

  .footer-note {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: #4A6080;
  }

  /* shake animation on error */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="brand">
    <div class="brand-icon">
      <!-- airplane icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
      </svg>
    </div>
    <div class="brand-title">機場接送管理系統</div>
    <div class="brand-sub">AIRPORT TRANSFER ADMIN</div>
  </div>

  {% if error %}
  <div class="error-msg">
    <svg viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px;flex-shrink:0">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/admin/login" id="loginForm">
    <div class="form-group">
      <label>管理員帳號</label>
      <div class="input-wrap">
        <input type="text" name="username" placeholder="請輸入帳號" autocomplete="username" required autofocus>
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 8a7 7 0 1114 0H3z"/>
        </svg>
      </div>
    </div>

    <div class="form-group">
      <label>密碼</label>
      <div class="input-wrap">
        <input type="password" name="password" placeholder="請輸入密碼" autocomplete="current-password" required>
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>

    <button type="submit" class="btn-login">登入後台</button>
  </form>

  <div class="footer-note">機場接送預約管理系統 &copy; 2026</div>
</div>

{% if error %}
<script>
  document.getElementById('loginCard').classList.add('shake');
</script>
{% endif %}

</body>
</html>
